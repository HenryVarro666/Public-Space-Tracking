<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">PUBLIC SPACE TRACKING</title><desc id="desc">Moves in and out, frame by frame. Detect people in street video and link their centroids across frames.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F7F9FC"/><stop offset="1" stop-color="#EFF3F7"/></linearGradient></defs><rect width="1600" height="960" fill="url(#paper)"/><g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="1600" height="9" rx="0" fill="#56688A" stroke="none"/>
<text x="64" y="66" font-size="20" fill="#172837" font-weight="700" letter-spacing="2" data-maxx="900">PUBLIC SPACE TRACKING</text>
<text x="1536" y="66" font-size="16" fill="#56688A" font-weight="600" letter-spacing="1" text-anchor="end">COURSE PROJECT / COMPUTER VISION</text>
<text x="60" y="167" font-size="72" fill="#142638" font-weight="500" data-maxx="1540">Moves in and out, frame by frame.</text>
<text x="64" y="221" font-size="27" fill="#344C5F" font-weight="400" data-maxx="1536">Detect people in street video and link their centroids across frames.</text>
<text x="64" y="262" font-size="20" fill="#697988" font-weight="400" data-maxx="1536">Faster R-CNN from the TF2 Detection Zoo; links marked against hand-drawn regions.</text>
<rect x="64" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="88" y="349" width="44" height="5" rx="2" fill="#56688A" stroke="none"/>
<text x="88" y="393" font-size="17" fill="#56688A" font-weight="700" letter-spacing="1.4" data-maxx="394">01 / COMPRESS</text>
<text x="88" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="394">Shorter video</text>
<text x="88" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">First 5,000 frames</text>
<text x="88" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">Every 5th frame kept</text>
<text x="88" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">Resolution unchanged</text>
<path d="M416 458h16m-6-6 6 6-6 6" fill="none" stroke="#56688A" stroke-width="2"/>
<rect x="440" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="464" y="349" width="44" height="5" rx="2" fill="#56688A" stroke="none"/>
<text x="464" y="393" font-size="17" fill="#56688A" font-weight="700" letter-spacing="1.4" data-maxx="770">02 / DETECT</text>
<text x="464" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="770">People per frame</text>
<text x="464" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">Faster R-CNN, TF2 zoo</text>
<text x="464" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">Person class only</text>
<text x="464" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">Boxes saved to CSV</text>
<path d="M792 458h16m-6-6 6 6-6 6" fill="none" stroke="#56688A" stroke-width="2"/>
<rect x="816" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="840" y="349" width="44" height="5" rx="2" fill="#56688A" stroke="none"/>
<text x="840" y="393" font-size="17" fill="#56688A" font-weight="700" letter-spacing="1.4" data-maxx="1146">03 / LINK</text>
<text x="840" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="1146">Centroid links</text>
<text x="840" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1146">Nearest centroid 5 frames on</text>
<text x="840" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1146">Long links dropped</text>
<text x="840" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1146">No persistent tracks</text>
<path d="M1168 458h16m-6-6 6 6-6 6" fill="none" stroke="#56688A" stroke-width="2"/>
<rect x="1192" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="1216" y="349" width="44" height="5" rx="2" fill="#56688A" stroke="none"/>
<text x="1216" y="393" font-size="17" fill="#56688A" font-weight="700" letter-spacing="1.4" data-maxx="1522">04 / LABEL</text>
<text x="1216" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="1522">Hand-drawn regions</text>
<text x="1216" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1522">Link enters or leaves a box</text>
<text x="1216" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1522">Drawn in the counter video</text>
<text x="1216" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1522">No in/out totals</text>
<rect x="64" y="635" width="470" height="211" rx="18" fill="#E3E8F1" stroke="none"/>
<text x="88" y="675" font-size="15" fill="#56688A" font-weight="700" letter-spacing="1.2" data-maxx="516">INGESTION</text>
<text x="88" y="722" font-size="24" fill="#193346" font-weight="600" data-maxx="516">Regions as data</text>
<text x="88" y="765" font-size="18" fill="#536777" font-weight="400" data-maxx="516">Entrance and exit rectangles are drawn</text>
<text x="88" y="795" font-size="18" fill="#536777" font-weight="400" data-maxx="516">with the mouse and saved to JSON.</text>
<rect x="565" y="635" width="470" height="211" rx="18" fill="#E8EDF3" stroke="none"/>
<text x="589" y="675" font-size="15" fill="#56688A" font-weight="700" letter-spacing="1.2" data-maxx="1017">OUTPUTS</text>
<text x="589" y="722" font-size="24" fill="#193346" font-weight="600" data-maxx="1017">Videos you can watch</text>
<text x="589" y="765" font-size="18" fill="#536777" font-weight="400" data-maxx="1017">Detection, counter and centroid-link</text>
<text x="589" y="795" font-size="18" fill="#536777" font-weight="400" data-maxx="1017">videos in demos/, plus a dot heatmap.</text>
<rect x="1066" y="635" width="470" height="211" rx="18" fill="#E8EDF3" stroke="none"/>
<text x="1090" y="675" font-size="15" fill="#56688A" font-weight="700" letter-spacing="1.2" data-maxx="1518">NEXT STEP</text>
<text x="1090" y="722" font-size="24" fill="#193346" font-weight="600" data-maxx="1518">Counts and a floor plan</text>
<text x="1090" y="765" font-size="18" fill="#536777" font-weight="400" data-maxx="1518">In/out totals and a perspective</text>
<text x="1090" y="795" font-size="18" fill="#536777" font-weight="400" data-maxx="1518">transform are not built yet.</text>
<path d="M64 888h1472" stroke="#CED9E3"/>
<text x="64" y="923" font-size="17" fill="#647788" font-weight="400" data-maxx="1536">PYTHON / JUPYTER  /  TensorFlow 2 · OpenCV. The Detectron2 notebook is the stock tutorial on sample images.</text>
</g></svg>
